<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="snSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4ecf5"/>
      <stop offset="55%" stop-color="#cddcec"/>
      <stop offset="100%" stop-color="#aec4dc"/>
    </linearGradient>
    <linearGradient id="snPuffTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0f8"/>
    </linearGradient>
    <linearGradient id="snPuffShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c3d4e6"/>
      <stop offset="100%" stop-color="#a8bcd2"/>
    </linearGradient>
    <linearGradient id="snHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f8fc"/>
      <stop offset="100%" stop-color="#d7e4f0"/>
    </linearGradient>
    <filter id="snBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="snPuff">
      <ellipse cx="0" cy="30" rx="150" ry="42" fill="url(#snPuffShade)"/>
      <ellipse cx="-70" cy="8" rx="70" ry="46" fill="url(#snPuffTop)"/>
      <ellipse cx="10" cy="-10" rx="90" ry="58" fill="url(#snPuffTop)"/>
      <ellipse cx="95" cy="10" rx="65" ry="42" fill="url(#snPuffTop)"/>
    </g>
  </defs>
  <rect width="1600" height="400" fill="url(#snSky)"/>

  <g filter="url(#snBlur)" opacity="0.9">
    <use href="#snPuff" transform="translate(220,90) scale(1.3)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;24,0;0,0" dur="30s" repeatCount="indefinite"/>
    </use>
    <use href="#snPuff" transform="translate(820,60) scale(1.5)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-20,0;0,0" dur="26s" repeatCount="indefinite"/>
    </use>
    <use href="#snPuff" transform="translate(1360,100) scale(1.2)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;22,0;0,0" dur="34s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#snPuff" transform="translate(220,90) scale(1.3)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;24,0;0,0" dur="30s" repeatCount="indefinite"/>
    </use>
    <use href="#snPuff" transform="translate(820,60) scale(1.5)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-20,0;0,0" dur="26s" repeatCount="indefinite"/>
    </use>
    <use href="#snPuff" transform="translate(1360,100) scale(1.2)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;22,0;0,0" dur="34s" repeatCount="indefinite"/>
    </use>
  </g>

  <path d="M0,300 C220,250 420,320 660,280 C900,240 1080,310 1300,270 C1420,250 1520,280 1600,265 L1600,400 L0,400 Z" fill="url(#snHill)"/>

  <g fill="#ffffff">
    <circle cx="120" cy="120" r="3" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;8,14;-4,26;3,38;0,0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="220" r="2.5" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-6,12;5,24;-2,34;0,0" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="150" r="3.2" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;7,16;-5,28;2,40;0,0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="260" r="2.4" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-8,10;4,22;-3,32;0,0" dur="8s" repeatCount="indefinite"/>

    <circle cx="640" cy="180" r="3" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;6,14;-6,26;3,36;0,0" dur="9.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="240" r="2.6" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-7,12;5,24;-2,34;0,0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="140" r="3.2" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;8,16;-4,28;3,40;0,0" dur="10.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="220" r="2.5" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-6,10;4,22;-3,32;0,0" dur="8.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="170" r="3" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;7,14;-5,26;2,36;0,0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1320" cy="250" r="2.6" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-8,12;5,24;-2,34;0,0" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1460" cy="150" r="3" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;6,16;-6,28;3,40;0,0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1550" cy="230" r="2.4" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-7,10;4,22;-3,32;0,0" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ovSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c3cbd6"/>
      <stop offset="45%" stop-color="#a7b1c0"/>
      <stop offset="100%" stop-color="#8891a3"/>
    </linearGradient>
    <linearGradient id="ovPuffTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f4f7"/>
      <stop offset="100%" stop-color="#d3d9e1"/>
    </linearGradient>
    <linearGradient id="ovPuffShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa4b3"/>
      <stop offset="100%" stop-color="#788294"/>
    </linearGradient>
    <filter id="ovBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="ovPuff">
      <ellipse cx="0" cy="30" rx="150" ry="42" fill="url(#ovPuffShade)"/>
      <ellipse cx="-70" cy="8" rx="70" ry="46" fill="url(#ovPuffTop)"/>
      <ellipse cx="10" cy="-10" rx="90" ry="58" fill="url(#ovPuffTop)"/>
      <ellipse cx="95" cy="10" rx="65" ry="42" fill="url(#ovPuffTop)"/>
    </g>
  </defs>
  <rect width="1600" height="400" fill="url(#ovSky)"/>

  <g filter="url(#ovBlur)" opacity="0.9">
    <use href="#ovPuff" transform="translate(260,110) scale(1.3)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;36,0;0,0" dur="30s" repeatCount="indefinite"/>
    </use>
    <use href="#ovPuff" transform="translate(760,70) scale(1.6)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-30,0;0,0" dur="26s" repeatCount="indefinite"/>
    </use>
    <use href="#ovPuff" transform="translate(1220,120) scale(1.4)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;40,0;0,0" dur="34s" repeatCount="indefinite"/>
    </use>
  </g>
  <g opacity="0.95">
    <use href="#ovPuff" transform="translate(260,110) scale(1.3)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;36,0;0,0" dur="30s" repeatCount="indefinite"/>
    </use>
    <use href="#ovPuff" transform="translate(760,70) scale(1.6)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-30,0;0,0" dur="26s" repeatCount="indefinite"/>
    </use>
    <use href="#ovPuff" transform="translate(1220,120) scale(1.4)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;40,0;0,0" dur="34s" repeatCount="indefinite"/>
    </use>
  </g>

  <g filter="url(#ovBlur)" opacity="0.6">
    <use href="#ovPuff" transform="translate(60,240) scale(1.1)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-20,0;0,0" dur="38s" repeatCount="indefinite"/>
    </use>
    <use href="#ovPuff" transform="translate(560,260) scale(1.3)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;24,0;0,0" dur="42s" repeatCount="indefinite"/>
    </use>
    <use href="#ovPuff" transform="translate(1020,250) scale(1.15)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-22,0;0,0" dur="36s" repeatCount="indefinite"/>
    </use>
    <use href="#ovPuff" transform="translate(1460,235) scale(1.1)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;26,0;0,0" dur="40s" repeatCount="indefinite"/>
    </use>
  </g>
</svg>

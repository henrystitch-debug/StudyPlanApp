<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="rnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="55%" stop-color="#38455a"/>
      <stop offset="100%" stop-color="#232d40"/>
    </linearGradient>
    <linearGradient id="rnPuffTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c8aa0"/>
      <stop offset="100%" stop-color="#5c6a82"/>
    </linearGradient>
    <linearGradient id="rnPuffShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c4658"/>
      <stop offset="100%" stop-color="#2a3245"/>
    </linearGradient>
    <filter id="rnBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <g id="rnPuff">
      <ellipse cx="0" cy="32" rx="160" ry="46" fill="url(#rnPuffShade)"/>
      <ellipse cx="-75" cy="6" rx="75" ry="48" fill="url(#rnPuffTop)"/>
      <ellipse cx="10" cy="-14" rx="95" ry="60" fill="url(#rnPuffTop)"/>
      <ellipse cx="100" cy="8" rx="68" ry="44" fill="url(#rnPuffTop)"/>
    </g>
    <g id="rnDrops" stroke="#bcd4e8" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
      <line x1="0" y1="0" x2="-14" y2="34"/>
      <line x1="40" y1="10" x2="26" y2="44"/>
      <line x1="80" y1="0" x2="66" y2="34"/>
      <line x1="120" y1="12" x2="106" y2="46"/>
      <line x1="160" y1="2" x2="146" y2="36"/>
    </g>
  </defs>
  <rect width="1600" height="400" fill="url(#rnSky)"/>

  <g filter="url(#rnBlur)" opacity="0.95">
    <use href="#rnPuff" transform="translate(240,90) scale(1.5)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;22,0;0,0" dur="28s" repeatCount="indefinite"/>
    </use>
    <use href="#rnPuff" transform="translate(760,60) scale(1.8)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-18,0;0,0" dur="24s" repeatCount="indefinite"/>
    </use>
    <use href="#rnPuff" transform="translate(1280,95) scale(1.5)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;26,0;0,0" dur="32s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#rnPuff" transform="translate(240,90) scale(1.5)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;22,0;0,0" dur="28s" repeatCount="indefinite"/>
    </use>
    <use href="#rnPuff" transform="translate(760,60) scale(1.8)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-18,0;0,0" dur="24s" repeatCount="indefinite"/>
    </use>
    <use href="#rnPuff" transform="translate(1280,95) scale(1.5)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;26,0;0,0" dur="32s" repeatCount="indefinite"/>
    </use>
  </g>

  <use href="#rnDrops" transform="translate(140,190) scale(1.4)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-15;0,45" dur="0.8s" begin="-0.1s" repeatCount="indefinite"/>
  </use>
  <use href="#rnDrops" transform="translate(420,210) scale(1.6)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-15;0,45" dur="0.75s" begin="-0.3s" repeatCount="indefinite"/>
  </use>
  <use href="#rnDrops" transform="translate(760,180) scale(1.3)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-15;0,45" dur="0.85s" begin="-0.5s" repeatCount="indefinite"/>
  </use>
  <use href="#rnDrops" transform="translate(1060,220) scale(1.5)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-15;0,45" dur="0.7s" begin="-0.2s" repeatCount="indefinite"/>
  </use>
  <use href="#rnDrops" transform="translate(1340,195) scale(1.4)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-15;0,45" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
  </use>
  <use href="#rnDrops" transform="translate(280,300) scale(1.3)" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-15;0,45" dur="0.9s" begin="-0.15s" repeatCount="indefinite"/>
  </use>
  <use href="#rnDrops" transform="translate(900,310) scale(1.4)" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-15;0,45" dur="0.78s" begin="-0.35s" repeatCount="indefinite"/>
  </use>
  <use href="#rnDrops" transform="translate(1450,300) scale(1.2)" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-15;0,45" dur="0.82s" begin="-0.55s" repeatCount="indefinite"/>
  </use>
</svg>

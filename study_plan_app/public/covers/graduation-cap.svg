<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gcSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241b4e"/>
      <stop offset="55%" stop-color="#3a2470"/>
      <stop offset="100%" stop-color="#552d7a"/>
    </linearGradient>
    <radialGradient id="gcGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffd88a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd88a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gcCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2350"/>
      <stop offset="100%" stop-color="#1a1436"/>
    </linearGradient>
    <g id="gcConfetti">
      <rect x="-5" y="-5" width="10" height="10" rx="2"/>
    </g>
  </defs>

  <rect width="1600" height="400" fill="url(#gcSky)"/>
  <circle cx="800" cy="170" r="260" fill="url(#gcGlow)"/>

  <!-- confetti -->
  <g>
    <use href="#gcConfetti" fill="#f6a934" transform="translate(420,80) rotate(20)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,18; 0,0" dur="3s" repeatCount="indefinite"/>
    </use>
    <use href="#gcConfetti" fill="#5fb3a3" transform="translate(1180,110) rotate(-30)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,-14; 0,0" dur="3.6s" repeatCount="indefinite"/>
    </use>
    <use href="#gcConfetti" fill="#e0678a" transform="translate(340,220) rotate(45)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,16; 0,0" dur="4.2s" repeatCount="indefinite"/>
    </use>
    <use href="#gcConfetti" fill="#f6d174" transform="translate(1260,240) rotate(-10)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,-16; 0,0" dur="3.3s" repeatCount="indefinite"/>
    </use>
    <use href="#gcConfetti" fill="#8fc6ea" transform="translate(1080,80) rotate(15)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,14; 0,0" dur="3.9s" repeatCount="indefinite"/>
    </use>
    <use href="#gcConfetti" fill="#f6a934" transform="translate(560,260) rotate(-25)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 0,-12; 0,0" dur="3.1s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- graduation cap -->
  <g transform="translate(800,190)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="800,190; 800,182; 800,190" dur="5s" repeatCount="indefinite"/>

    <!-- mortarboard top (diamond) -->
    <path d="M-220,0 L0,-70 L220,0 L0,70 Z" fill="url(#gcCap)"/>
    <!-- top sheen -->
    <path d="M-220,0 L0,-70 L220,0 L0,-30 Z" fill="#3a3066" opacity="0.6"/>

    <!-- base / head band -->
    <path d="M-100,16 Q0,64 100,16 L100,52 Q0,96 -100,52 Z" fill="#2c2350"/>

    <!-- button -->
    <circle cx="0" cy="-2" r="9" fill="#f6d174"/>

    <!-- tassel -->
    <path d="M0,-2 C60,10 90,10 96,30" stroke="#f6d174" stroke-width="4" fill="none"/>
    <g transform="translate(96,30)">
      <animateTransform attributeName="transform" type="rotate" values="-6 96 30; 6 96 30; -6 96 30" dur="2.6s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="34" stroke="#f6d174" stroke-width="4"/>
      <path d="M-10,34 L10,34 L6,52 L-6,52 Z" fill="#f6d174"/>
    </g>
  </g>

  <!-- stars -->
  <g fill="#fdf3d8" opacity="0.85">
    <circle cx="200" cy="70" r="2.4"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1420" cy="60" r="2"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="1500" cy="180" r="1.8"><animate attributeName="opacity" values="0.8;0.25;0.8" dur="4.3s" repeatCount="indefinite"/></circle>
  </g>
</svg>

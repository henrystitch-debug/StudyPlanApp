<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lsSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4327"/>
      <stop offset="55%" stop-color="#8a5a34"/>
      <stop offset="100%" stop-color="#a9713f"/>
    </linearGradient>
    <radialGradient id="lsGlow" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffe6b0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffe6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lsShelfWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3a22"/>
      <stop offset="100%" stop-color="#432814"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#lsSky)"/>
  <rect width="1600" height="400" fill="url(#lsGlow)"/>

  <!-- two shelves of books -->
  <g>
    <!-- shelf 1 -->
    <g transform="translate(0,60)">
      <rect x="30" y="0" width="36" height="110" fill="#c96b4a"/>
      <rect x="70" y="10" width="30" height="100" fill="#3f8f7a"/>
      <rect x="104" y="0" width="26" height="110" fill="#dba43a"/>
      <rect x="134" y="14" width="34" height="96" fill="#4f6fb0"/>
      <rect x="172" y="4" width="28" height="106" fill="#b8577a"/>
      <rect x="204" y="0" width="30" height="110" fill="#6ea644"/>
      <rect x="238" y="12" width="26" height="98" fill="#c96b4a"/>

      <rect x="380" y="6" width="30" height="104" fill="#4f6fb0"/>
      <rect x="414" y="0" width="34" height="110" fill="#dba43a"/>
      <rect x="452" y="14" width="26" height="96" fill="#3f8f7a"/>
      <rect x="482" y="2" width="30" height="108" fill="#b8577a"/>
      <rect x="516" y="10" width="28" height="100" fill="#6ea644"/>

      <rect x="1100" y="4" width="32" height="106" fill="#dba43a"/>
      <rect x="1136" y="0" width="26" height="110" fill="#c96b4a"/>
      <rect x="1166" y="12" width="30" height="98" fill="#4f6fb0"/>
      <rect x="1200" y="6" width="28" height="104" fill="#3f8f7a"/>
      <rect x="1232" y="0" width="34" height="110" fill="#b8577a"/>

      <rect x="0" y="112" width="1600" height="16" fill="url(#lsShelfWood)"/>
    </g>

    <!-- shelf 2 -->
    <g transform="translate(0,220)">
      <rect x="700" y="6" width="30" height="104" fill="#c96b4a"/>
      <rect x="734" y="0" width="34" height="110" fill="#6ea644"/>
      <rect x="772" y="14" width="26" height="96" fill="#dba43a"/>
      <rect x="802" y="2" width="30" height="108" fill="#4f6fb0"/>
      <rect x="836" y="10" width="28" height="100" fill="#b8577a"/>

      <rect x="1240" y="0" width="32" height="110" fill="#3f8f7a"/>
      <rect x="1276" y="12" width="26" height="98" fill="#c96b4a"/>
      <rect x="1306" y="4" width="30" height="106" fill="#dba43a"/>
      <rect x="1340" y="0" width="28" height="110" fill="#4f6fb0"/>

      <rect x="60" y="4" width="30" height="106" fill="#b8577a"/>
      <rect x="94" y="0" width="26" height="110" fill="#6ea644"/>
      <rect x="124" y="14" width="34" height="96" fill="#c96b4a"/>

      <rect x="0" y="112" width="1600" height="16" fill="url(#lsShelfWood)"/>
    </g>
  </g>

  <!-- floating dust-mote sparkle -->
  <g fill="#ffe9bd" opacity="0.8">
    <circle cx="900" cy="90" r="2.4">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="150" r="1.8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="70" r="2">
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="suSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fa8e0"/>
      <stop offset="55%" stop-color="#8fc6ea"/>
      <stop offset="100%" stop-color="#cfeaf5"/>
    </linearGradient>
    <radialGradient id="suGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="55%" stop-color="#ffe9a8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suPuffTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7fb"/>
    </linearGradient>
    <linearGradient id="suPuffShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe1ee"/>
      <stop offset="100%" stop-color="#aecadf"/>
    </linearGradient>
    <linearGradient id="suHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fae5a"/>
      <stop offset="100%" stop-color="#557a3c"/>
    </linearGradient>
    <filter id="suBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="suPuff">
      <ellipse cx="0" cy="28" rx="140" ry="38" fill="url(#suPuffShade)"/>
      <ellipse cx="-65" cy="6" rx="65" ry="42" fill="url(#suPuffTop)"/>
      <ellipse cx="8" cy="-10" rx="85" ry="52" fill="url(#suPuffTop)"/>
      <ellipse cx="88" cy="8" rx="60" ry="38" fill="url(#suPuffTop)"/>
    </g>
  </defs>
  <rect width="1600" height="400" fill="url(#suSky)"/>

  <circle cx="1260" cy="110" r="230" fill="url(#suGlow)">
    <animate attributeName="opacity" values="1;0.8;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1260" cy="110" r="58" fill="#fffaf0">
    <animate attributeName="r" values="58;62;58" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#fff6d8" stroke-width="4" opacity="0.55" stroke-linecap="round">
    <line x1="1260" y1="10" x2="1260" y2="-30">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1370" y1="45" x2="1400" y2="18">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1410" y1="110" x2="1450" y2="110">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="4.2s" repeatCount="indefinite"/>
    </line>
    <line x1="1150" y1="45" x2="1120" y2="18">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="4.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <g filter="url(#suBlur)" opacity="0.95">
    <use href="#suPuff" transform="translate(220,120) scale(1.3)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;30,0;0,0" dur="26s" repeatCount="indefinite"/>
    </use>
    <use href="#suPuff" transform="translate(650,80) scale(1.1)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-24,0;0,0" dur="22s" repeatCount="indefinite"/>
    </use>
    <use href="#suPuff" transform="translate(940,170) scale(1.4)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;34,0;0,0" dur="30s" repeatCount="indefinite"/>
    </use>
  </g>
  <g>
    <use href="#suPuff" transform="translate(220,120) scale(1.3)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;30,0;0,0" dur="26s" repeatCount="indefinite"/>
    </use>
    <use href="#suPuff" transform="translate(650,80) scale(1.1)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;-24,0;0,0" dur="22s" repeatCount="indefinite"/>
    </use>
    <use href="#suPuff" transform="translate(940,170) scale(1.4)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;34,0;0,0" dur="30s" repeatCount="indefinite"/>
    </use>
  </g>

  <path d="M0,330 C240,290 460,350 700,320 C940,290 1160,340 1400,310 C1480,300 1560,315 1600,308 L1600,400 L0,400 Z" fill="url(#suHill)"/>
</svg>
